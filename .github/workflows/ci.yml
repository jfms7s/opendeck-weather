name: CI
# Replaces the in-repo jobs test, aarch64, macos, advisories, quality.
on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  # Reports the checks as `ci / <job>`: those are the names for the
  # "Protect master" ruleset (see opendeck-plugin-ci's README).
  ci:
    permissions:
      contents: read
      packages: read # the report-only eng-metrics-lab job
    uses: jfms7s/opendeck-plugin-ci/.github/workflows/ci.yml@098bfd0f9d891c2db4f26cd95627e6e6a567563a # v0.1.0
    with:
      # The jobs the ruleset requires: fails if an input above switches one off (skipped counts as green).
      required-jobs: "test aarch64 macos bundle"
      node-version-file: ".nvmrc"
      pi-tests: "tests/*.test.mjs"
      release-notes-check: true
      aarch64: true
      macos-check: "scripts/check-binary.sh {bin} --mach-o"
      audit: "cargo-deny"
      deny-checks: "advisories sources"
