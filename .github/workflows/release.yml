name: Release
# Push a vX.Y.Z tag matching Cargo.toml and assets/manifest.json. This
# scans Cargo.lock for RustSec advisories (cargo-deny, as in CI), builds and
# tests the tagged commit (Linux binaries on Ubuntu and the macOS one on a
# macOS runner, in parallel; no build cache), packages the bundle in a
# separate job, then creates a *draft* release with the bundle, SHA256SUMS and a
# build-provenance attestation attached, so a release is never visible
# without its asset. The draft's notes start with the README's
# smoke-test checklist, unticked, under an UNVERIFIED line
# (scripts/release-body.mjs). Run that checklist on Linux and a Mac, record it
# in the notes, then publish with scripts/publish-release.sh (see "Releasing").
# Publishing freezes it: immutable releases are meant to be on for this
# repository, so a published release's assets and tag can't be replaced - fix
# a bad release with a new version.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build-macos:
    # Native Apple Silicon build. No write access: it runs every crate's
    # build script, like `build`.
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain has no release tags: pinned to a master commit.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Check it is a signed arm64 binary that starts
        run: |
          bin=target/aarch64-apple-darwin/release/opendeck-weather
          file "$bin"
          # macOS's file says "executable arm64", Linux's "arm64 executable".
          file -b "$bin" | grep -Eq '^Mach-O 64-bit (arm64 executable|executable arm64)'
          # Apple Silicon kills unsigned binaries; the linker's ad-hoc
          # signature must survive `strip = true`.
          codesign --verify --verbose "$bin"
          # Without OpenDeck's arguments it stops at the first missing flag,
          # which proves it got as far as main().
          out=$("$bin" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "missing CLI flag: -port"
      - name: Pack the binary (a tar keeps the executable bit; artifacts don't)
        run: tar -cf macos-bin.tar -C target/aarch64-apple-darwin/release opendeck-weather
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-bin
          path: macos-bin.tar
          if-no-files-found: error

  build:
    # No write access here: this job runs every crate's build script. It
    # runs alongside build-macos; package joins the two.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the crate and manifest versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          manifest=$(jq -r .Version assets/manifest.json)
          if [ "$tag" != "$crate" ] || [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $crate, manifest.json $manifest must all match"
            exit 1
          fi
      # The same scan as CI's advisories job: a tag never drafts a release
      # while a RustSec advisory is open against Cargo.lock. Accept one on
      # purpose with a deny.toml [advisories] ignore entry and a reason.
      - name: Check for RustSec advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check advisories
      # dtolnay/rust-toolchain has no release tags: pinned to a master commit.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Install cross-compilation linker (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      - name: Start the aarch64 binary under qemu (it links and runs)
        run: |
          sudo apt-get install -y qemu-user
          # Without OpenDeck's arguments it stops at the first missing flag,
          # which proves it got as far as main().
          out=$(qemu-aarch64 -L /usr/aarch64-linux-gnu \
            target/aarch64-unknown-linux-gnu/release/opendeck-weather 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "missing CLI flag: -port"
      - name: Pack the Linux binaries (a tar keeps the executable bit; artifacts don't)
        run: |
          tar -cf linux-bins.tar -C target \
            x86_64-unknown-linux-gnu/release/opendeck-weather \
            aarch64-unknown-linux-gnu/release/opendeck-weather
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-bins
          path: linux-bins.tar
          if-no-files-found: error

  package:
    # Assembles the bundle from both builds. No write access, no cargo.
    needs: [build, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-bins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-bin
      - name: Unpack the Linux binaries where build.mjs looks for them
        run: |
          mkdir -p target
          tar -xf linux-bins.tar -C target
          test -x target/x86_64-unknown-linux-gnu/release/opendeck-weather
          test -x target/aarch64-unknown-linux-gnu/release/opendeck-weather
      - name: Unpack the macOS binary where build.mjs looks for it
        run: |
          mkdir -p target/aarch64-apple-darwin/release
          tar -xf macos-bin.tar -C target/aarch64-apple-darwin/release
          bin=target/aarch64-apple-darwin/release/opendeck-weather
          test -x "$bin"
          # macOS's file says "executable arm64", Linux's "arm64 executable".
          file -b "$bin" | grep -Eq '^Mach-O 64-bit (arm64 executable|executable arm64)'
      - name: Assemble the bundle (every target in the manifest's CodePaths)
        run: node build.mjs --all
      - name: Zip the bundle and checksum it
        run: |
          (cd dist && zip -r ../opendeck-weather.streamDeckPlugin com.jfms7s.weather.sdPlugin)
          unzip -Z opendeck-weather.streamDeckPlugin | grep -E '^-rwx.*opendeck-weather-aarch64-apple-darwin$'
          sha256sum opendeck-weather.streamDeckPlugin > SHA256SUMS
          cat SHA256SUMS
      # Written after the bundle is zipped and checksummed, so it is in
      # neither; it only becomes the draft's notes.
      - name: Write the draft's notes (the README smoke checklist, unticked)
        run: node scripts/release-body.mjs > RELEASE_BODY.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            opendeck-weather.streamDeckPlugin
            SHA256SUMS
            RELEASE_BODY.md
          if-no-files-found: error

  publish:
    # Runs no project code: downloads the built files and creates the draft.
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: opendeck-weather.streamDeckPlugin
      # --generate-notes appends GitHub's change list after RELEASE_BODY.md.
      - name: Create a draft release with the bundle and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file RELEASE_BODY.md --generate-notes \
            opendeck-weather.streamDeckPlugin SHA256SUMS
