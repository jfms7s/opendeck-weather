name: Release
# Push a vX.Y.Z tag matching Cargo.toml and assets/manifest.json. This
# builds and tests the tagged commit (Linux binaries on Ubuntu, the macOS
# one on a macOS runner), then creates a *draft* release with the bundle,
# SHA256SUMS and a build-provenance attestation attached, so a release is
# never visible without its asset. Publish the draft by hand once the
# README's smoke-test checklist has been run and pasted into its notes.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build-macos:
    # Native Apple Silicon build. No write access: it runs every crate's
    # build script, like `build`.
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain has no release tags: pinned to a master commit.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Check it is a signed arm64 binary that starts
        run: |
          bin=target/aarch64-apple-darwin/release/opendeck-weather
          file "$bin"
          file "$bin" | grep -q 'Mach-O 64-bit executable arm64'
          # Apple Silicon kills unsigned binaries; the linker's ad-hoc
          # signature must survive `strip = true`.
          codesign --verify --verbose "$bin"
          # Without OpenDeck's arguments it stops at the first missing flag,
          # which proves it got as far as main().
          out=$("$bin" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "missing CLI flag: -port"
      - name: Pack the binary (a tar keeps the executable bit; artifacts don't)
        run: tar -cf macos-bin.tar -C target/aarch64-apple-darwin/release opendeck-weather
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-bin
          path: macos-bin.tar
          if-no-files-found: error

  build:
    # No write access here: this job runs every crate's build script.
    needs: build-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the crate and manifest versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          manifest=$(jq -r .Version assets/manifest.json)
          if [ "$tag" != "$crate" ] || [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $crate, manifest.json $manifest must all match"
            exit 1
          fi
      # dtolnay/rust-toolchain has no release tags: pinned to a master commit.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master 2026-10-01
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Install cross-compilation linker (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      - name: Start the aarch64 binary under qemu (it links and runs)
        run: |
          sudo apt-get install -y qemu-user
          # Without OpenDeck's arguments it stops at the first missing flag,
          # which proves it got as far as main().
          out=$(qemu-aarch64 -L /usr/aarch64-linux-gnu \
            target/aarch64-unknown-linux-gnu/release/opendeck-weather 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "missing CLI flag: -port"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-bin
      - name: Unpack the macOS binary where build.mjs looks for it
        run: |
          mkdir -p target/aarch64-apple-darwin/release
          tar -xf macos-bin.tar -C target/aarch64-apple-darwin/release
          bin=target/aarch64-apple-darwin/release/opendeck-weather
          test -x "$bin"
          file "$bin" | grep -q 'Mach-O 64-bit executable arm64'
      - name: Assemble the bundle (every target in the manifest's CodePaths)
        run: node build.mjs --all
      - name: Zip the bundle and checksum it
        run: |
          (cd dist && zip -r ../opendeck-weather.streamDeckPlugin com.jfms7s.weather.sdPlugin)
          unzip -Z opendeck-weather.streamDeckPlugin | grep -E '^-rwx.*opendeck-weather-aarch64-apple-darwin$'
          sha256sum opendeck-weather.streamDeckPlugin > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            opendeck-weather.streamDeckPlugin
            SHA256SUMS
          if-no-files-found: error

  publish:
    # Runs no project code: downloads the built files and creates the draft.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: opendeck-weather.streamDeckPlugin
      - name: Create a draft release with the bundle and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes \
            opendeck-weather.streamDeckPlugin SHA256SUMS
