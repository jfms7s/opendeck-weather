<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="pi.css" />
	<style>
		#current { color: var(--pi-text); font-weight: 600; overflow-wrap: anywhere; }
		/* Shown and hidden by the script through style.display. */
		#results { display: none; }
	</style>
</head>
<body>
	<main class="pi">
		<section class="card">
			<h2>Location</h2>
			<div class="field">
				<span class="label">Current location</span>
				<div id="current">Not set</div>
			</div>
			<div class="field">
				<label for="query">Search</label>
				<div class="row">
					<input type="text" id="query" placeholder="City or postal code" />
					<button id="search" class="primary">Search</button>
				</div>
				<p id="status" class="hint"></p>
				<select id="results" size="5"></select>
			</div>
		</section>

		<section class="card">
			<h2>Display</h2>
			<div class="field">
				<label for="units">Units</label>
				<select id="units">
					<option value="metric">Metric (°C, km/h)</option>
					<option value="imperial">Imperial (°F, mph)</option>
				</select>
			</div>

			<div id="day-field" class="field hidden">
				<label for="day">Day</label>
				<select id="day">
					<option value="0">Today</option>
					<option value="1">Tomorrow</option>
					<option value="2">In 2 days</option>
					<option value="3">In 3 days</option>
					<option value="4">In 4 days</option>
					<option value="5">In 5 days</option>
					<option value="6">In 6 days</option>
				</select>
				<p class="hint">Which day's forecast the key shows.</p>
			</div>

			<div id="aqi-field" class="field hidden">
				<label for="aqi_scale">Index</label>
				<select id="aqi_scale">
					<option value="us">US AQI</option>
					<option value="european">European AQI</option>
				</select>
				<p class="hint">Air-quality scale the key shows.</p>
			</div>
		</section>

		<section class="card">
			<h2>Data source</h2>
			<p class="hint">Weather data by Open-Meteo.com (CC BY 4.0)</p>
		</section>
	</main>

	<script>
		window.connectOpenActionSocketData = new Promise((resolve) => {
			window.connectOpenActionSocket = (...args) => resolve(args);
			window.connectElgatoStreamDeckSocket = window.connectOpenActionSocket;
		});

		const $ = (id) => document.getElementById(id);
		let websocket;
		let uuid;
		let action;
		// Always sent whole: setSettings replaces the instance's settings,
		// so fields this action ignores must still round-trip untouched.
		let settings = {};
		let places = [];

		window.connectOpenActionSocketData.then(([inPort, inUUID, inRegisterEvent, inInfo, inActionInfo]) => {
			uuid = inUUID;
			const actionInfo = JSON.parse(inActionInfo);
			action = actionInfo.action;
			$("day-field").classList.toggle("hidden", action !== "com.jfms7s.weather.forecast");
			$("aqi-field").classList.toggle("hidden", action !== "com.jfms7s.weather.airquality");

			websocket = new WebSocket(`ws://127.0.0.1:${inPort}`);
			websocket.onopen = () => {
				websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
				applySettings(actionInfo.payload.settings || {});
			};
			websocket.onmessage = (event) => {
				const message = JSON.parse(event.data);
				if (message.event === "didReceiveSettings") {
					applySettings(message.payload.settings || {});
				} else if (message.event === "sendToPropertyInspector") {
					handlePluginMessage(message.payload);
				}
			};
		});

		function applySettings(s) {
			settings = s;
			$("current").textContent = s.location ? s.location.name : "Not set";
			$("units").value = s.units || "metric";
			$("day").value = String(s.day ?? 1);
			$("aqi_scale").value = s.aqi_scale || "us";
		}

		function sendSettings() {
			websocket.send(JSON.stringify({ event: "setSettings", context: uuid, payload: settings }));
		}

		function search() {
			const query = $("query").value.trim();
			if (!query) return;
			$("status").textContent = "Searching…";
			websocket.send(JSON.stringify({
				event: "sendToPlugin",
				action,
				context: uuid,
				payload: { event: "search", query },
			}));
		}

		function handlePluginMessage(payload) {
			if (payload.event !== "searchResults") return;
			if (payload.query !== $("query").value.trim()) return; // superseded
			const select = $("results");
			select.innerHTML = "";
			if (payload.error) {
				$("status").textContent = "Search failed: " + payload.error;
				select.style.display = "none";
				return;
			}
			places = payload.results || [];
			if (places.length === 0) {
				$("status").textContent = "No matches";
				select.style.display = "none";
				return;
			}
			$("status").textContent = "Pick a match:";
			places.forEach((p, i) => {
				const option = document.createElement("option");
				option.value = String(i);
				option.textContent = p.label;
				select.appendChild(option);
			});
			select.style.display = "block";
		}

		function pickPlace() {
			const place = places[Number($("results").value)];
			if (!place) return;
			settings.location = { name: place.name, latitude: place.latitude, longitude: place.longitude };
			$("current").textContent = place.label;
			$("results").style.display = "none";
			$("status").textContent = "";
			sendSettings();
		}

		$("search").addEventListener("click", search);
		$("query").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
		$("results").addEventListener("change", pickPlace);
		$("units").addEventListener("change", () => { settings.units = $("units").value; sendSettings(); });
		$("day").addEventListener("change", () => { settings.day = Number($("day").value); sendSettings(); });
		$("aqi_scale").addEventListener("change", () => { settings.aqi_scale = $("aqi_scale").value; sendSettings(); });
	</script>
</body>
</html>
