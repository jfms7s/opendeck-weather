<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="pi.css" />
	<style>
		#current { color: var(--pi-text); font-weight: 600; overflow-wrap: anywhere; }
	</style>
</head>
<body>
	<main class="pi">
		<section class="card">
			<h2>Location</h2>
			<div class="field">
				<span class="label">Current location</span>
				<div id="current">Not set</div>
				<p id="default-hint" class="hint"></p>
				<div class="row">
					<button id="make-default" class="hidden">Use for all actions</button>
					<button id="follow-default" class="hidden">Use the default instead</button>
				</div>
			</div>
			<div class="field">
				<label for="query">Search</label>
				<div class="row">
					<!-- maxlength matches MAX_QUERY_CHARS in src/open_meteo.rs -->
					<input type="text" id="query" maxlength="100" placeholder="City or postal code" />
					<button id="search" class="primary">Search</button>
				</div>
				<p id="status" class="hint"></p>
				<select id="results" class="hidden" size="5"></select>
			</div>
		</section>

		<section class="card">
			<h2>Display</h2>
			<div class="field">
				<label for="units">Units</label>
				<select id="units">
					<option value="metric">Metric (°C, km/h)</option>
					<option value="imperial">Imperial (°F, mph)</option>
				</select>
			</div>

			<!-- Fields with data-action show only for that action. -->
			<div class="field hidden" data-action="com.jfms7s.weather.forecast">
				<label for="day">Day</label>
				<!-- One option per forecast day: FORECAST_DAYS in src/open_meteo.rs -->
				<select id="day">
					<option value="0">Today</option>
					<option value="1">Tomorrow</option>
					<option value="2">In 2 days</option>
					<option value="3">In 3 days</option>
					<option value="4">In 4 days</option>
					<option value="5">In 5 days</option>
					<option value="6">In 6 days</option>
				</select>
				<p class="hint">Which day's forecast the key shows.</p>
			</div>

			<div class="field hidden" data-action="com.jfms7s.weather.airquality">
				<label for="aqi_scale">Index</label>
				<select id="aqi_scale">
					<option value="us">US AQI</option>
					<option value="european">European AQI</option>
				</select>
				<p class="hint">Air-quality scale the key shows.</p>
			</div>
		</section>

		<section class="card">
			<h2>Data source</h2>
			<p class="hint">Weather data by Open-Meteo.com (CC BY 4.0)</p>
		</section>
	</main>

	<script>
		window.connectOpenActionSocketData = new Promise((resolve) => {
			window.connectOpenActionSocket = (...args) => resolve(args);
			window.connectElgatoStreamDeckSocket = window.connectOpenActionSocket;
		});

		const $ = (id) => document.getElementById(id);
		const show = (el, visible) => el.classList.toggle("hidden", !visible);
		let websocket;
		let uuid;
		let action;
		// Always sent whole: setSettings replaces the instance's settings,
		// so fields this action ignores must still round-trip untouched.
		let settings = {};
		// The plugin-wide default location, used when settings.location is unset.
		let defaultLocation = null;
		let places = [];

		window.connectOpenActionSocketData.then(([inPort, inUUID, inRegisterEvent, inInfo, inActionInfo]) => {
			uuid = inUUID;
			const actionInfo = JSON.parse(inActionInfo);
			action = actionInfo.action;
			document.querySelectorAll("[data-action]").forEach((el) => show(el, el.dataset.action === action));

			websocket = new WebSocket(`ws://127.0.0.1:${inPort}`);
			websocket.onopen = () => {
				websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
				applySettings(actionInfo.payload.settings || {});
				sendToPlugin({ event: "getDefaultLocation" });
			};
			websocket.onmessage = (event) => {
				const message = JSON.parse(event.data);
				if (message.event === "didReceiveSettings") {
					applySettings(message.payload.settings || {});
				} else if (message.event === "sendToPropertyInspector") {
					handlePluginMessage(message.payload);
				}
			};
		});

		/** False (and nothing is sent) until the socket is open. */
		function send(message) {
			if (websocket?.readyState !== WebSocket.OPEN) return false;
			websocket.send(JSON.stringify(message));
			return true;
		}

		function sendToPlugin(payload) {
			return send({ event: "sendToPlugin", action, context: uuid, payload });
		}

		function sendSettings() {
			send({ event: "setSettings", context: uuid, payload: settings });
		}

		const placeName = (location) => location.label || location.name;

		// The fallbacks below must equal Settings::default() in src/model.rs
		// (a Rust test checks them).
		function applySettings(s) {
			settings = s;
			$("units").value = s.units || "metric";
			$("day").value = String(s.day ?? 1);
			$("aqi_scale").value = s.aqi_scale || "us";
			showLocation();
		}

		function showLocation() {
			const own = settings.location;
			if (own) {
				$("current").textContent = placeName(own);
			} else if (defaultLocation) {
				$("current").textContent = placeName(defaultLocation) + " (default)";
			} else {
				$("current").textContent = "Not set";
			}
			$("default-hint").textContent = defaultLocation
				? "Default for all actions: " + placeName(defaultLocation)
				: "";
			const isDefault = own && defaultLocation
				&& own.latitude === defaultLocation.latitude && own.longitude === defaultLocation.longitude;
			show($("make-default"), Boolean(own) && !isDefault);
			show($("follow-default"), Boolean(own) && Boolean(defaultLocation));
		}

		function search() {
			const query = $("query").value.trim();
			if (!query) return;
			if (!sendToPlugin({ event: "search", query })) return;
			$("status").textContent = "Searching…";
		}

		function handlePluginMessage(payload) {
			if (payload.event === "defaultLocation") {
				defaultLocation = payload.location || null;
				showLocation();
				return;
			}
			if (payload.event !== "searchResults") return;
			if (payload.query !== $("query").value.trim()) return; // superseded
			const select = $("results");
			select.innerHTML = "";
			if (payload.error) {
				$("status").textContent = "Search failed: " + payload.error;
				show(select, false);
				return;
			}
			places = payload.results || [];
			if (places.length === 0) {
				$("status").textContent = "No matches";
				show(select, false);
				return;
			}
			$("status").textContent = "Pick a match:";
			places.forEach((p, i) => {
				const option = document.createElement("option");
				option.value = String(i);
				option.textContent = p.label;
				select.appendChild(option);
			});
			show(select, true);
		}

		function pickPlace() {
			const place = places[Number($("results").value)];
			if (!place) return;
			settings.location = {
				name: place.name,
				label: place.label,
				latitude: place.latitude,
				longitude: place.longitude,
			};
			show($("results"), false);
			$("status").textContent = "";
			showLocation();
			sendSettings();
		}

		$("search").addEventListener("click", search);
		$("query").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
		$("results").addEventListener("change", pickPlace);
		$("make-default").addEventListener("click", () => {
			sendToPlugin({ event: "setDefaultLocation", location: settings.location });
		});
		$("follow-default").addEventListener("click", () => {
			delete settings.location;
			showLocation();
			sendSettings();
		});
		$("units").addEventListener("change", () => { settings.units = $("units").value; sendSettings(); });
		$("day").addEventListener("change", () => { settings.day = Number($("day").value); sendSettings(); });
		$("aqi_scale").addEventListener("change", () => { settings.aqi_scale = $("aqi_scale").value; sendSettings(); });
	</script>
</body>
</html>
