[package]
name = "opendeck-weather"
version = "0.1.1"
edition = "2024"
# Let-chains (stable since 1.88), and several dependencies need 1.88 too.
# CI checks the build on exactly this version.
rust-version = "1.88"
license = "MIT"
description = "OpenDeck plugin: current weather, daily forecast and air quality on Stream Deck keys and dials"
repository = "https://github.com/jfms7s/opendeck-weather"

[dependencies]
openaction = "2.7"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "2"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
simplelog = "0.12"
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["test-util", "macros", "rt", "net", "io-util"] }

[profile.release]
# About a third smaller binary (measured 9.25 MB -> 6.04 MB). No
# `panic = "abort"`: a panic in a spawned render task must stay contained.
lto = true
codegen-units = 1
strip = true
